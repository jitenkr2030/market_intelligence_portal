<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ s.title }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/static/core/app.css" rel="stylesheet"></head><body class="login-bg"><div class="public-card"><h2>{{ s.title }}</h2><p class="text-muted">{{ s.description }}</p><form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Your name (optional)</label><input class="form-control" name="respondent"></div>{% for q in s.questions.all %}<div class="mb-4"><label class="form-label fw-bold">{{ forloop.counter }}. {{ q.prompt }}{% if q.required %} *{% endif %}</label>{% if q.question_type == 'textarea' %}<textarea class="form-control" name="q_{{ q.id }}" {% if q.required %}required{% endif %}></textarea>{% elif q.question_type == 'rating' %}<select class="form-select" name="q_{{ q.id }}">{% for n in '12345' %}<option>{{ n }}</option>{% endfor %}</select>{% elif q.question_type == 'number' %}<input type="number" class="form-control" name="q_{{ q.id }}">{% else %}<input class="form-control" name="q_{{ q.id }}" {% if q.required %}required{% endif %}>{% endif %}{% if q.options %}<small class="text-muted">Options: {{ q.options|linebreaksbr }}</small>{% endif %}</div>{% endfor %}<button class="btn btn-primary">Submit response</button></form></div></body></html>
